name: Android CI (APK only)
# Continuous verification for every main/security-hardening change

on:
  push:
    branches: ["main", "security-hardening"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Avoid wasting CI minutes and artifact storage on superseded pushes.
concurrency:
  group: android-ci-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
          validate-wrappers: false

      - name: Cache offline Quran page images
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/quran_pages
          key: quran-pages-${{ runner.os }}-${{ hashFiles('scripts/prepare_quran_pages.py') }}

      - name: Prepare offline Quran page images
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 -m pip install --user --break-system-packages Pillow
          python3 scripts/prepare_quran_pages.py

      - name: Validate bundled Quran text
        run: python3 scripts/validate_quran_assets.py

      - name: Unit tests
        run: gradle --no-daemon test

      - name: Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify all Quran pages are bundled for offline reading
        run: |
          python3 - <<'PY'
          import io
          import json
          import re
          import zipfile
          from pathlib import Path
          from PIL import Image

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          if not apk.is_file():
              raise SystemExit("Debug APK was not created")
          with zipfile.ZipFile(apk) as archive:
              pages = sorted(
                  name for name in archive.namelist()
                  if re.fullmatch(r"assets/quran_pages/\d{3}\.webp", name)
              )
              if len(pages) != 604:
                  raise SystemExit(
                      f"Offline Quran verification failed: expected 604 page images in APK, found {len(pages)}"
                  )
              total_bytes = 0
              for index, name in enumerate(pages, start=1):
                  expected = f"assets/quran_pages/{index:03d}.webp"
                  if name != expected:
                      raise SystemExit(f"Missing or misnamed Quran page: {expected}")
                  data = archive.read(name)
                  with Image.open(io.BytesIO(data)) as image:
                      image.verify()
                  total_bytes += len(data)
              text_parts = sorted(
                  name for name in archive.namelist()
                  if re.fullmatch(r"assets/quran_uthmani_part_\d{2}\.json", name)
              )
              if len(text_parts) != 15:
                  raise SystemExit(f"Expected 15 bundled Quran text parts in APK, found {len(text_parts)}")
              surahs = {}
              for name in text_parts:
                  payload = json.loads(archive.read(name).decode("utf-8"))
                  for surah in payload.get("surahs", []):
                      sid = int(surah["id"])
                      if sid in surahs:
                          raise SystemExit(f"Duplicate Quran surah in APK: {sid}")
                      surahs[sid] = surah
              ayah_count = sum(len(surah.get("verses", [])) for surah in surahs.values())
              if len(surahs) != 114 or ayah_count != 6236:
                  raise SystemExit(f"APK Quran text mismatch: {len(surahs)} surahs, {ayah_count} ayahs")
              adhan_files = sorted(
                  name for name in archive.namelist()
                  if re.fullmatch(r"res/raw/adhan_[a-z0-9_]+\.mp3", name)
              )
              if len(adhan_files) < 4:
                  raise SystemExit(f"Expected at least 4 bundled adhan MP3 resources in APK, found {len(adhan_files)}")
              print(f"Verified APK: 604 Quran page images, {len(surahs)} surahs, {ayah_count} ayahs, {len(adhan_files)} adhan MP3 resources.")
              print(f"Verified all 604 readable Quran page images inside APK ({total_bytes / (1024 * 1024):.1f} MiB).")
          PY

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Aqim-Salat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

