name: Android CI

on:
  push:
    branches: ["main", "security-hardening"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test

      - name: Debug APK
        run: ./gradlew assembleDebug

      - name: Release AAB compile check
        run: ./gradlew bundleRelease
