name: Android CI
# Continuous verification for every main/security-hardening change

on:
  push:
    branches: ["main", "security-hardening"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
          validate-wrappers: false

      - name: Unit tests
        run: gradle test

      - name: Debug APK
        run: gradle assembleDebug

      - name: Release AAB compile check
        run: gradle bundleRelease
