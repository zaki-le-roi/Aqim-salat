name: Android CI
# Continuous verification for every main/security-hardening change

on:
  push:
    branches: ["main", "security-hardening"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Avoid wasting CI minutes and artifact storage on superseded pushes.
concurrency:
  group: android-ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Aqim-Salat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Release AAB
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Aqim-Salat-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 3
