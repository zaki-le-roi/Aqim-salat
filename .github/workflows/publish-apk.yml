name: Publish signed APK update

on:
  # Version tags publish normally. This one-time main-branch condition publishes the requested 1.4.4 calendar fix only.
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: publish-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
          validate-wrappers: false

      - name: Configure persistent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing repository secret ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing repository secret ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing repository secret ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aqim-salat-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/aqim-salat-release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Set version for this update
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
          elif [ "$REF_TYPE" = "branch" ]; then
            VERSION="1.4.7"
          else
            VERSION="1.4.$RUN_NUMBER"
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          python3 - "$VERSION" "$CODE" <<'PY'
          from pathlib import Path
          import re
          import sys
          path = Path("app/build.gradle.kts")
          content = path.read_text()
          content = re.sub(r'versionCode = \d+', f"versionCode = {sys.argv[2]}", content, count=1)
          content = re.sub(r'versionName = "[^"]+"', f'versionName = "{sys.argv[1]}"', content, count=1)
          path.write_text(content)
          PY

      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease

      - name: Prepare signed APK artifact
        run: cp app/build/outputs/apk/release/app-release.apk Aqim-Salat.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aqim-Salat-signed-apk
          path: Aqim-Salat.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish latest signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" Aqim-Salat.apk --clobber
          else
            gh release create "$RELEASE_TAG" Aqim-Salat.apk \
              --target "$GITHUB_SHA" \
              --title "أقم صلاتك $RELEASE_VERSION" \
              --notes "تحديث رسمي لتطبيق أقم صلاتك. يُنزّل التحديث من داخل التطبيق. يتطلب Android تأكيد التثبيت." 
          fi
