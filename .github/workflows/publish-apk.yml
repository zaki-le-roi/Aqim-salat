name: Publish signed APK update

on:
  # Main builds get a unique version; release tags use their exact version.
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: publish-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          validate-wrappers: false

      - name: Configure persistent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing repository secret ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing repository secret ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing repository secret ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aqim-salat-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/aqim-salat-release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Set version for this update
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
          elif [ "$REF_TYPE" = "branch" ]; then
            LAST_PATCH="$(gh release list --limit 100 --json tagName --jq '[.[] | .tagName | select(test("^v1\\.4\\.[0-9]+$")) | ltrimstr("v") | split(".")[2] | tonumber] | max // 7')"
            NEXT_PATCH=$((LAST_PATCH + 1))
            VERSION="1.4.$NEXT_PATCH"
          else
            echo "Unsupported ref type: $REF_TYPE"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          if [ "$CODE" -le 1004007 ]; then
            echo "Refusing to publish a versionCode that is not newer than 1.4.7"
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          python3 - "$VERSION" "$CODE" <<'PY'
          from pathlib import Path
          import re
          import sys
          path = Path("app/build.gradle.kts")
          content = path.read_text()
          content = re.sub(r'versionCode = \d+', f"versionCode = {sys.argv[2]}", content, count=1)
          content = re.sub(r'versionName = "[^"]+"', f'versionName = "{sys.argv[1]}"', content, count=1)
          path.write_text(content)
          PY

      - name: Cache offline Quran page images
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/quran_pages
          key: quran-pages-${{ runner.os }}-${{ hashFiles('scripts/prepare_quran_pages.py') }}

      - name: Prepare offline Quran page images
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 -m pip install --user --break-system-packages Pillow
          python3 scripts/prepare_quran_pages.py

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease

      - name: Validate APK before publishing
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk Aqim-Salat.apk
          test -s Aqim-Salat.apk
          unzip -t Aqim-Salat.apk >/dev/null
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer 2>/dev/null | sort -V | tail -n 1)"
          test -n "$APKANALYZER"
          test "$("$APKANALYZER" manifest application-id Aqim-Salat.apk)" = "com.example"
          test "$("$APKANALYZER" manifest version-name Aqim-Salat.apk)" = "$RELEASE_VERSION"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose Aqim-Salat.apk

      - name: Verify all Quran page images are bundled in release APK
        run: |
          python3 - <<'PY'
          import io
          import zipfile
          from pathlib import Path
          from PIL import Image

          apk = Path("Aqim-Salat.apk")
          if not apk.is_file():
              raise SystemExit("Release APK was not created")
          expected = [f"assets/quran_pages/{page:03d}.webp" for page in range(1, 605)]
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              actual = sorted(
                  name for name in names
                  if name.startswith("assets/quran_pages/") and not name.endswith("/")
              )
              if actual != expected:
                  missing = sorted(set(expected) - set(actual))
                  extra = sorted(set(actual) - set(expected))
                  raise SystemExit(
                      f"Release Quran verification failed: expected exactly 604 pages; "
                      f"found {len(actual)} files. Missing: {missing[:10]}; extra: {extra[:10]}"
                  )
              total_bytes = 0
              for name in expected:
                  data = archive.read(name)
                  with Image.open(io.BytesIO(data)) as image:
                      image.verify()
                  total_bytes += len(data)
          print(
              f"Verified exactly 604 valid Quran page images in release APK "
              f"({total_bytes / (1024 * 1024):.1f} MiB)."
          )
          PY

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aqim-Salat-signed-apk
          path: Aqim-Salat.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish latest signed APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "Aqim-Salat.apk"; then
              echo "Release $RELEASE_TAG already contains an APK. Refusing to overwrite a published version."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" Aqim-Salat.apk
          else
            gh release create "$RELEASE_TAG" Aqim-Salat.apk \
              --target "$GITHUB_SHA" \
              --title "أقم صلاتك $RELEASE_VERSION" \
              --notes "تحديث رسمي لتطبيق أقم صلاتك. تم فحص بنية APK وتوقيعه قبل النشر. يتطلب Android تأكيد التثبيت."
          fi
